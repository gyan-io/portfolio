<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paa Kwesi Gyan Turkson Journal</title>
<style>
:root{
 --black:#0A0A0A; --board:#141311; --paper:#F4EEE2; --paper-2:#E9E1D2; --paper-edge:#DAD0BC;
 --ink:#1A1916; --ink-soft:#6E675B;
 --grey:#8F8F8F; --brown:#9A5B3C; --orange:#F26A2E; --blue:#3B82F6; --purple:#8B5CF6; --green:#3FAE72;
 --turn:1020ms;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
 --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--black);color:#EDE7DA;font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:26px 18px 18px;overflow:hidden}

.tools{width:min(1080px,100%);display:flex;align-items:center;gap:14px;margin:0 0 12px 2px}
.tool{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);background:transparent;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:9px 14px;cursor:pointer}
.tool[aria-pressed="true"]{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.tool:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tools .static{font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.3)}

.stage{width:min(1080px,100%);perspective:4200px;perspective-origin:50% 50%}
.book{position:relative;width:100%;aspect-ratio:1080/660;min-height:430px}
@media (max-height:720px){.book{aspect-ratio:1080/600}}

.board{position:absolute;top:0;height:100%;width:50%;background:linear-gradient(145deg,#1b1a17,#101010 70%);border:1px solid rgba(255,255,255,.055);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.board.l{left:0;border-radius:6px 2px 2px 6px;box-shadow:inset -22px 0 40px rgba(0,0,0,.6)}
.board.r{left:50%;border-radius:2px 6px 6px 2px;box-shadow:inset 22px 0 40px rgba(0,0,0,.6)}
.board span{font:600 10.5px/1.9 var(--sans);letter-spacing:.42em;text-transform:uppercase;color:rgba(237,231,218,.2);text-align:center}
.board .rule{width:26px;height:1px;background:rgba(237,231,218,.16)}

.spine{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:100%;z-index:220;pointer-events:none}
.spine i{position:absolute;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#5d5a53,#211f1c 70%);box-shadow:0 1px 2px rgba(0,0,0,.7)}

.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform var(--turn) cubic-bezier(.3,.02,.2,1)}
.leaf.turned{transform:rotateY(-179.4deg)}
.leaf.instant{transition:none}

.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:linear-gradient(115deg,var(--paper) 0%,var(--paper) 62%,var(--paper-2) 100%);color:var(--ink)}
.face.front{border-radius:2px 5px 5px 2px;box-shadow:inset 14px 0 26px -18px rgba(90,70,40,.5),0 16px 40px rgba(0,0,0,.45)}
.face.back{transform:rotateY(180deg);border-radius:5px 2px 2px 5px;box-shadow:inset -14px 0 26px -18px rgba(90,70,40,.5),0 16px 40px rgba(0,0,0,.45)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(120,100,70,.12) 1px,transparent 1px);background-size:4px 4px}

.shade{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 340ms ease}
.face.front .shade{background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.12) 55%,rgba(255,255,255,.1))}
.face.back .shade{background:linear-gradient(270deg,rgba(0,0,0,.5),rgba(0,0,0,.1) 55%,rgba(255,255,255,.08));opacity:.3}
.leaf.turning .face.front .shade{opacity:1}
.leaf.turned .face.front .shade{opacity:.88}
.castshadow{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 420ms ease;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 62%)}
.castshadow.on{opacity:1}

.inner{position:absolute;inset:0;z-index:9;padding:40px 44px 0;display:flex;flex-direction:column}
.eyebrow{font:600 10px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft)}
h2{font:800 32px/1.1 var(--sans);margin:12px 0 8px;letter-spacing:-.018em}
.sub{font:400 14px/1.5 var(--sans);color:var(--ink-soft);max-width:44ch;margin:0 0 16px}

.marg .numeral{font:400 132px/1 var(--serif);color:rgba(26,25,22,.13);margin:14px 0 4px;letter-spacing:-.02em}
.marg .thesis{font:italic 400 18.5px/1.45 var(--serif);color:var(--ink);max-width:22ch;margin:6px 0 0}
.marg .spacer{flex:1}
.marg .stamp{width:104px;height:104px;border-radius:50%;border:1.5px solid currentColor;opacity:.5;display:flex;align-items:center;justify-content:center;text-align:center;font:600 8.5px/1.7 var(--sans);letter-spacing:.2em;text-transform:uppercase;transform:rotate(-8deg);margin-bottom:22px}
.marg .note{font:400 12.5px/1.5 var(--sans);color:var(--ink-soft);padding-top:12px;border-top:1px solid rgba(26,25,22,.14);margin:0 0 6px}
.sprig{opacity:.85;margin-bottom:12px}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 14px}
.legend i{display:inline-flex;align-items:center;gap:7px;font:600 9.5px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-style:normal}
.legend i::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid currentColor}

.trailwrap{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding-right:6px;scrollbar-width:thin}
.trailsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.trailsvg path{fill:none;stroke:rgba(26,25,22,.34);stroke-width:1.4;stroke-dasharray:5 7;stroke-linecap:round}
.trailsvg path.draw{animation:draw 1500ms ease forwards}
@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}

.trail{list-style:none;margin:0;padding:0 0 26px;position:relative;z-index:1}
.node{display:flex;gap:13px;align-items:flex-start;padding:5px 0 9px}
.target{position:relative;flex:0 0 auto;width:19px;height:19px;margin-top:2px;border:0;padding:0;background:transparent;cursor:pointer;color:var(--grey)}
.target::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor}
.target::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:currentColor}
.target:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:50%}
.target.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 7px rgba(0,0,0,.05)}}
.bleed{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,currentColor 0%,transparent 68%)}
.node.visited .bleed{animation:bleed 900ms ease forwards}
@keyframes bleed{0%{opacity:.34;transform:scale(.3)}100%{opacity:.11;transform:scale(1)}}
.c-grey{color:var(--grey)}.c-brown{color:var(--brown)}.c-orange{color:var(--orange)}
.c-blue{color:var(--blue)}.c-purple{color:var(--purple)}.c-green{color:var(--green)}

.body{min-width:0;flex:1}
.title{font:700 15px/1.3 var(--sans);color:var(--ink);display:inline}
.tag{display:inline-block;vertical-align:2px;margin-left:8px;font:600 8.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:4px 8px;opacity:.85}
.meta{font:400 12.5px/1.45 var(--sans);color:var(--ink-soft);margin:3px 0 0}
.detail{max-height:0;overflow:hidden;transition:max-height 520ms ease,opacity 380ms ease;opacity:0}
.node.open .detail{max-height:520px;opacity:1}
.detail ul{margin:9px 0 2px;padding-left:16px}
.detail li{font:400 12.8px/1.55 var(--sans);color:#3B372F;margin-bottom:5px}
.tip{margin:10px 0 2px;font:400 12.5px/1.5 var(--sans);color:#3B372F;animation:tip 520ms ease}
@keyframes tip{from{opacity:0;transform:translateY(6px) rotate(-1deg)}to{opacity:1}}
.tip-card{background:#FBF7EE;border:1px solid rgba(26,25,22,.14);border-left:3px solid currentColor;padding:11px 13px;box-shadow:0 2px 8px rgba(60,45,20,.09)}
.tip-photo{background:#fff;border:1px solid rgba(26,25,22,.1);padding:11px 13px 14px;transform:rotate(-.5deg);position:relative;box-shadow:0 3px 12px rgba(60,45,20,.13)}
.tip-photo::before{content:"";position:absolute;top:-8px;left:26px;width:58px;height:16px;background:rgba(214,198,164,.6);transform:rotate(-3deg)}
.tip-cert{background:linear-gradient(135deg,#FBF7EE 88%,rgba(26,25,22,.1) 88%);border:1px solid rgba(26,25,22,.2);padding:11px 13px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 18px;border-top:1px solid rgba(26,25,22,.13);margin-top:auto}
.btn{font:600 12.5px/1 var(--sans);border-radius:999px;border:1px solid rgba(26,25,22,.24);background:transparent;color:var(--ink);padding:13px 17px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.28;cursor:default}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.folio{font:600 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
.footline{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-top:1px solid rgba(26,25,22,.13);margin-top:auto}

.peel{position:absolute;right:0;bottom:0;width:104px;height:104px;z-index:12;cursor:pointer;border:0;padding:0;background:linear-gradient(315deg,rgba(0,0,0,.14),transparent 52%);border-radius:0 0 5px 0}
.peel span{position:absolute;right:14px;bottom:52px;font:600 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.peel.back{left:0;right:auto;background:linear-gradient(45deg,rgba(0,0,0,.14),transparent 52%);border-radius:0 0 0 5px}
.peel.back span{left:14px;right:auto;bottom:52px}

.ribbon{position:absolute;top:-16px;right:-26px;z-index:240;width:22px}
.silk{width:22px;background:linear-gradient(180deg,#B8432A,#8E2F1D);border-radius:2px 2px 0 0;box-shadow:0 3px 10px rgba(0,0,0,.5);transition:height 420ms cubic-bezier(.3,.02,.2,1);position:relative;cursor:grab}
.silk::after{content:"";position:absolute;left:0;bottom:-13px;width:22px;height:14px;background:linear-gradient(180deg,#8E2F1D,#7A2717);clip-path:polygon(0 0,100% 0,100% 100%,50% 58%,0 100%)}
.ribbon-label{position:absolute;right:40px;top:-2px;white-space:nowrap;font:600 9.5px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:rgba(237,231,218,.55)}
.pips{position:absolute;top:0;right:0;width:22px;height:100%}
.pip{display:block;width:22px;height:34px;border:0;background:transparent;cursor:pointer}
.pip:focus-visible{outline:2px solid #fff}

.hint{margin-top:14px;font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:rgba(237,231,218,.24);text-align:center}

.colophon h3{font:800 26px/1.15 var(--sans);margin:10px 0 8px}
.colophon .thesis{font:italic 400 16px/1.45 var(--serif);margin:0 0 16px;max-width:24ch}
.colophon .lab{font:700 10.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink);margin:0 0 7px}
.colophon .stackline{font:400 12.8px/1.6 var(--sans);color:var(--ink-soft);margin:0 0 18px;max-width:40ch}
.colophon .open{font:400 12.8px/1.55 var(--sans);color:#3B372F;margin:0 0 11px;max-width:42ch}
.colophon .links{display:flex;flex-wrap:wrap;gap:8px 9px;margin:0}
.colophon .links a{font:600 11.5px/1 var(--sans);color:var(--ink);text-decoration:none;border:1px solid rgba(26,25,22,.22);border-radius:999px;padding:9px 12px}
.colophon .links a:hover{background:rgba(26,25,22,.06)}
.colophon .back{display:inline-block;margin-top:16px;font:600 12.5px/1 var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start;background:none;border:0;padding:0}

@media (max-width:820px){
 .leaf{left:0;width:100%}
 .board.l,.spine,.hint,.peel,.ribbon{display:none}
 .board.r{left:0;width:100%;border-radius:6px}
 .inner{padding:26px 22px 0}
 h2{font-size:26px}
 .marg .numeral{font-size:92px}
 .marg .thesis{font-size:16.5px}
 .book{aspect-ratio:auto;height:78vh}
 .colophon .links a{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
 .leaf{transition:opacity 240ms ease}
 .leaf.turned{transform:none;opacity:0;pointer-events:none}
 .trailsvg path.draw{animation:none}
 .target.pulse{animation:none}
 .detail{transition:none}
}
</style>
</head>
<body>

<div class="tools">
  <button class="tool" id="sound" aria-pressed="false">sound off</button>
  <span class="static">drag the page · or the ribbon</span>
</div>

<div class="stage">
  <div class="book" id="book">
    <div class="board l"><span>Journal</span><div class="rule"></div><span>MMXXVI</span></div>
    <div class="board r"><span>The end</span><div class="rule"></div></div>
    <div class="spine" id="spine"></div>
    <div class="ribbon" id="ribbon" role="slider" tabindex="0" aria-label="Bookmark" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0">
      <div class="ribbon-label" id="ribbonLabel">Cover</div>
      <div class="silk" id="silk"></div>
      <div class="pips" id="pips"></div>
    </div>
  </div>
</div>

<div class="hint">drag a page from either edge · tap a target · ← →</div>

<script>
const PAGES=["cover","index","experience","projects","volunteering","education"];
const LABELS=["Cover","Contents","Experience","Projects","Volunteer","Education","Endpaper"];
const MAX=PAGES.length;

const DATA={
 cover:{},
 index:{eyebrow:"Contents",title:"Four chapters",sub:"Follow the dashed trail. Every target is coloured by the kind of work it was.",tip:"card",
  nodes:[
   {t:"Experience",m:"Two roles in backend, applied AI and data",c:"c-grey",go:2},
   {t:"Projects",m:"Five builds, shipped and measured",c:"c-orange",go:3},
   {t:"Volunteering",m:"Community organising and ambassadorship",c:"c-blue",go:4},
   {t:"Education",m:"Two degrees · five certifications",c:"c-purple",go:5}
  ]},
 experience:{eyebrow:"Chapter one",title:"Experience",sub:"Grey targets are technical roles. Brown targets are non-technical.",tip:"card",
  numeral:"01",stamp:"Technical &amp; non-tech",stampC:"c-grey",
  thesis:"Build the system, then make the system legible to everyone else.",
  note:"Backend architecture, applied AI, and the data groundwork underneath both.",
  legend:[["c-grey","Technical"],["c-brown","Non-technical"]],
  nodes:[
   {t:"Backend &amp; AI Engineer at Infinimus Labs",g:"Technical",c:"c-grey",m:"Remote, part-time · Jun 2025 – Present",
    d:["Designing backend architecture, APIs and database systems for LevLang, a speech-based language learning platform.","AI integration and system infrastructure across the stack."]},
   {t:"Data Assistant at Data Edge Insights",g:"Technical",c:"c-grey",m:"Remote · May 2020 – Present",
    d:["Managed data entry and organisation across Excel, Sheets and databases.","Built report and presentation templates for evidence-based decisions.","Drafted reports and charts under senior staff guidance."]},
   {t:"Community &amp; program work",g:"Non-technical",c:"c-brown",m:"Ongoing · workshops, facilitation",
    d:["Workshop facilitation, program coordination and community-facing sessions across Accra."]}
  ]},
 projects:{eyebrow:"Chapter two",title:"Projects",sub:"Every project carries an orange target.",tip:"photo",
  numeral:"02",stamp:"Built &amp; shipped",stampC:"c-orange",
  thesis:"Five builds, one habit: ship the thing, then measure whether it helped.",
  note:"Sign language AI, parametric crop insurance, waste modelling, nutrition tooling.",
  nodes:[
   {t:"Ahenkan",c:"c-orange",m:"Jun 2026 – Present",d:["Co-building an AI frontier model for sign languages, starting with the Ghanaian ecosystem."]},
   {t:"Parametric Crop Insurance Dashboard",c:"c-orange",m:"Apr 2026",d:["District-level drought-risk prediction for Ghana using satellite rainfall, soil data and hazard indices.","XGBoost models served behind interactive maps."]},
   {t:"Sign Language Interpretation AI",c:"c-orange",m:"Nov 2026 · UNICEF Startup Lab Hackathon",d:["Backend with FastAPI, model integration and real-time testing with OpenCV.","77.78% accuracy on single words and short phrases for sign-to-text."]},
   {t:"Estimation of Plastic Waste Generated",c:"c-orange",m:"Apr – May 2025",d:["Projects plastic waste generation and recycling trends 2025–2035 from a 2025 base year.","Models population growth with improving recycling rates over time."]},
   {t:"Nutrition Chatbot",c:"c-orange",m:"Sep – Oct 2023",d:["Python chatbot recommending food for weight loss or muscle gain, including Ghanaian options."]}
  ]},
 volunteering:{eyebrow:"Chapter three",title:"Volunteering",sub:"Grey targets are tech communities. Blue targets are impact and community work.",tip:"card",
  numeral:"03",stamp:"Tech &amp; impact",stampC:"c-blue",
  thesis:"The community is infrastructure too, so maintain it.",
  note:"Organising, ambassadorship and climate education across Accra.",
  legend:[["c-grey","Tech community"],["c-blue","Impact"]],
  nodes:[
   {t:"Replit Ghana, Organizer",g:"Tech",c:"c-grey",m:"Jan 2026 – Present · Accra",
    d:["Co-organized the Build with AI Agent workshop for the Replit Ghana community."]},
   {t:"Notion Ambassador",g:"Tech",c:"c-grey",m:"Jul 2024 – Present · Accra",
    d:["Led the Notion Accra workshop, <i>Building Your Life and Goals with the Second Brain System on Notion</i>.",
       "Co-organized and coordinated the Notion Accra Community Meetup: Power Users Discourse 2025.",
       "Led a technical session on personalizing Notion AI Agents at Make with Notion Accra 2025, demonstrating real-time agent setup for internal database creation and engineering roadmaps.",
       "Co-organized the Notion Accra 2024 Make with Notion Watch Party."]},
   {t:"Global Shapers Accra",g:"Impact",c:"c-blue",m:"Oct 2024 – Present · Accra",
    d:["Organised workshops with the Climate Reality Project on plastic-waste management, segregation and recycling.","Part of a community of young change-makers advancing civic and economic engagement in Accra."]}
  ]},
 education:{eyebrow:"Chapter four",title:"Education",sub:"Purple targets are degrees. Green targets are certificate courses.",tip:"cert",
  numeral:"04",stamp:"Certified &amp; degreed",stampC:"c-green",
  thesis:"Chemistry first, then data. The second degree explains the first.",
  note:"Two degrees, five certificates, one through-line.",
  legend:[["c-purple","Degree"],["c-green","Certificate"]],
  nodes:[
   {t:"MSc Internet of Things &amp; Big Data",g:"Degree",c:"c-purple",m:"Ghana Communications Technology University · Feb 2026 – Present",d:["Distributed sensing, data infrastructure and large-scale analytics."]},
   {t:"BSc Industrial Chemistry",g:"Degree",c:"c-purple",m:"University of Cape Coast · Aug 2019 – Sep 2024",d:["Materials, process chemistry and the lab discipline that still shapes how I test models."]},
   {t:"IBM Data Science Professional Certificate",g:"Certificate",c:"c-green",m:"Nov 2024 – Apr 2025"},
   {t:"Introduction to Generative AI",g:"Certificate",c:"c-green",m:"Jan 2025"},
   {t:"ChatGPT Prompt Engineering for Developers",g:"Certificate",c:"c-green",m:"Jul – Aug 2023"},
   {t:"Python Core, Sololearn",g:"Certificate",c:"c-green",m:"Mar 2021 – Nov 2021"}
  ]}
};

const book=document.getElementById("book");
let t=0,busy=false,soundOn=false,actx=null;

function sprig(){return '<svg class="sprig" width="96" height="92" viewBox="0 0 96 92" aria-hidden="true"><path d="M18 86 C40 68 60 44 76 12" stroke="#4F6B45" stroke-width="2" fill="none" stroke-linecap="round"/><g fill="#6D8B5C"><ellipse cx="66" cy="20" rx="12" ry="8" transform="rotate(-32 66 20)"/><ellipse cx="78" cy="32" rx="11" ry="7" transform="rotate(14 78 32)"/><ellipse cx="52" cy="38" rx="12" ry="8" transform="rotate(-26 52 38)"/><ellipse cx="62" cy="52" rx="11" ry="7" transform="rotate(18 62 52)"/><ellipse cx="36" cy="58" rx="11" ry="7" transform="rotate(-30 36 58)"/><ellipse cx="24" cy="76" rx="10" ry="6.5" transform="rotate(-14 24 76)"/></g></svg>';}

function nodeHtml(n,key,isIndex){
 const tipClass=DATA[key]&&DATA[key].tip==="photo"?"tip-photo":DATA[key]&&DATA[key].tip==="cert"?"tip-cert":"tip-card";
 const detail=n.d?'<div class="detail"><div class="tip '+tipClass+'"><ul>'+n.d.map(x=>"<li>"+x+"</li>").join("")+"</ul></div></div>":"";
 const tag=n.g?'<span class="tag">'+n.g+"</span>":"";
 return '<li class="node"><button class="target '+n.c+'" aria-label="'+n.t.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&")+'" '+(isIndex?'data-go="'+n.go+'"':"")+'><span class="bleed"></span></button><div class="body"><span class="title">'+n.t+"</span>"+tag+'<p class="meta">'+(n.m||"")+"</p>"+detail+"</div></li>";
}

function rightHtml(key,idx){
 if(key==="cover"){
  return '<div class="inner"><div style="flex:1"></div><p class="eyebrow">Portfolio · 2026</p><h2 style="font-size:42px;margin-top:14px">Paa Kwesi Gyan Turkson</h2><p class="sub">Data science, ML engineering &amp; backend systems.<br>Applied AI on problems that matter. Accra, Ghana.</p><button class="btn primary" data-go="1" style="align-self:flex-start;margin-top:8px">Open the journal →</button><div style="flex:1.4"></div><div class="footline"><span class="folio">Cover</span><span class="folio">Accra, Ghana</span></div></div>';
 }
 const d=DATA[key];
 const legend=d.legend?'<div class="legend">'+d.legend.map(l=>'<i class="'+l[0]+'">'+l[1]+"</i>").join("")+"</div>":"";
 const nodes=d.nodes.map(n=>nodeHtml(n,key,key==="index")).join("");
 const nav='<div class="nav"><button class="btn" data-dir="-1">← Back</button><span class="folio">'+idx+" / "+(MAX-1)+'</span><button class="btn primary" data-dir="1">'+(idx===MAX-1?"Endpaper →":"Next chapter →")+"</button></div>";
 return '<div class="inner"><p class="eyebrow">'+d.eyebrow+"</p><h2>"+d.title+'</h2><p class="sub">'+d.sub+"</p>"+legend+'<div class="trailwrap"><svg class="trailsvg" aria-hidden="true"><path d=""></path></svg><ul class="trail">'+nodes+"</ul></div>"+nav+"</div>";
}

function leftHtml(key){
 if(key==="colophon"){
  return '<div class="inner colophon"><p class="eyebrow">Endpaper</p><h3>Contact</h3><p class="thesis">Thanks for reading to the back cover.</p>'+
   '<p class="lab">Stack</p><p class="stackline">Python · SQL · PyTorch · FastAPI · Git/GitHub · Notion · Generative AI · Microsoft Office</p>'+
   '<p class="lab">Get in touch</p><p class="open">Open to data science, ML engineering, backend systems, research, community collaboration, or remote opportunities.</p>'+
   '<div class="links"><a href="mailto:gyanturkson2016@gmail.com">Email</a><a href="https://www.linkedin.com/in/paa-kwesi-turkson-772134212/" target="_blank" rel="noopener">LinkedIn</a><a href="https://github.com/gyan-io" target="_blank" rel="noopener">GitHub</a><a href="https://x.com/The_Nightfall37" target="_blank" rel="noopener">X</a></div>'+
   '<button class="back" data-go="0">Back to the cover →</button><div style="flex:1"></div><div class="footline"><span class="folio">Endpaper</span><span class="folio">© 2026 · Accra, Ghana</span></div></div>';
 }
 const d=DATA[key];
 if(key==="index"){
  return '<div class="inner marg"><p class="eyebrow">The journal</p><div class="numeral">00</div><p class="thesis">Every colour is a claim: what kind of work this was.</p><div class="spacer"></div>'+sprig()+'<p class="note">Flip with the corner, the page edge, or the ribbon on the right.</p><div class="footline"><span class="folio">Contents</span><span class="folio">Paa Kwesi Gyan Turkson</span></div></div>';
 }
 return '<div class="inner marg"><p class="eyebrow">'+d.eyebrow+'</p><div class="numeral">'+d.numeral+'</div><p class="thesis">'+d.thesis+'</p><div class="spacer"></div><div class="stamp '+d.stampC+'">'+d.stamp+'</div><p class="note">'+d.note+'</p><div class="footline"><span class="folio">'+d.eyebrow+'</span><span class="folio">Paa Kwesi Gyan Turkson</span></div></div>';
}

function render(){
 const spine=document.getElementById("spine");
 for(let i=0;i<16;i++){const r=document.createElement("i");r.style.top=(4+i*6.1)+"%";spine.appendChild(r);}
 const frag=document.createDocumentFragment();
 PAGES.forEach((key,i)=>{
  const leaf=document.createElement("div");leaf.className="leaf";leaf.dataset.i=i;
  leaf.innerHTML='<div class="face front">'+rightHtml(key,i)+'<div class="castshadow"></div><div class="shade"></div>'+
   '<button class="peel" data-dir="1"><span>Turn ›</span></button></div>'+
   '<div class="face back">'+leftHtml(PAGES[i+1]||"colophon")+'<div class="shade"></div>'+
   '<button class="peel back" data-dir="-1"><span>‹ Back</span></button></div>';
  frag.appendChild(leaf);
 });
 book.insertBefore(frag,document.getElementById("spine"));
 const pips=document.getElementById("pips");
 for(let i=0;i<=MAX;i++){const b=document.createElement("button");b.className="pip";b.dataset.jump=i;b.setAttribute("aria-label","Go to "+LABELS[i]);pips.appendChild(b);}
}
render();

const leaves=()=>[...book.querySelectorAll(".leaf")];

function applyDepth(){
 leaves().forEach((l,i)=>{
  const turned=l.classList.contains("turned");
  l.style.zIndex=turned?100+i:100-i;
  const front=l.querySelector(".face.front"),back=l.querySelector(".face.back");
  const frontLive=(!turned&&i===t),backLive=(turned&&i===t-1);
  front.style.pointerEvents=frontLive?"auto":"none";
  back.style.pointerEvents=backLive?"auto":"none";
  front.querySelectorAll("button,a").forEach(b=>b.tabIndex=frontLive?0:-1);
  back.querySelectorAll("button,a").forEach(b=>b.tabIndex=backLive?0:-1);
  const p=front.querySelector(".peel");if(p)p.style.display=t===MAX?"none":"";
  const pb=back.querySelector(".peel.back");if(pb)pb.style.display=t===0?"none":"";
 });
 leaves().forEach(l=>{const b=l.querySelector(".nav [data-dir='-1']");if(b)b.disabled=(+l.dataset.i===0);});
 document.getElementById("silk").style.height=(70+t*36)+"px";
 document.getElementById("ribbonLabel").textContent=LABELS[t];
 document.getElementById("ribbon").setAttribute("aria-valuenow",t);
}

function drawTrail(){
 const live=leaves()[t];if(!live)return;
 const wrap=live.querySelector(".face.front .trailwrap");if(!wrap)return;
 const svg=wrap.querySelector(".trailsvg"),path=svg.querySelector("path");
 const wr=wrap.getBoundingClientRect();
 const pts=[...wrap.querySelectorAll(".target")].map(el=>{const r=el.getBoundingClientRect();return{x:r.left-wr.left+r.width/2,y:r.top-wr.top+r.height/2+wrap.scrollTop};});
 if(pts.length<2){path.setAttribute("d","");return;}
 let d="M"+pts[0].x+" "+pts[0].y;
 for(let i=1;i<pts.length;i++){
  const a=pts[i-1],b=pts[i],bow=(i%2?1:-1)*16,my=(a.y+b.y)/2;
  d+=" C"+(a.x+bow)+" "+(a.y+(my-a.y)*.6)+" "+(b.x-bow)+" "+(b.y-(b.y-my)*.6)+" "+b.x+" "+b.y;
 }
 path.setAttribute("d",d);
 path.classList.remove("draw");void path.getBBox();path.classList.add("draw");
}

function pointNext(){
 document.querySelectorAll(".target.pulse").forEach(e=>e.classList.remove("pulse"));
 const live=leaves()[t];if(!live)return;
 const first=live.querySelector(".face.front .node:not(.visited) .target");
 if(first)first.classList.add("pulse");
}

function rustle(){
 if(!soundOn)return;
 try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const dur=.42,sr=actx.sampleRate,buf=actx.createBuffer(1,sr*dur,sr),ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++){const p=i/ch.length;ch[i]=(Math.random()*2-1)*Math.pow(1-p,1.7);}
  const src=actx.createBufferSource();src.buffer=buf;
  const bp=actx.createBiquadFilter();bp.type="bandpass";bp.Q.value=.8;
  bp.frequency.setValueAtTime(1600,actx.currentTime);
  bp.frequency.exponentialRampToValueAtTime(4200,actx.currentTime+dur);
  const g=actx.createGain();g.gain.setValueAtTime(.09,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0008,actx.currentTime+dur);
  src.connect(bp).connect(g).connect(actx.destination);src.start();
 }catch(e){}
}

function setState(next,instant){
 t=Math.max(0,Math.min(MAX,next));
 leaves().forEach((l,i)=>{
  if(instant)l.classList.add("instant");
  l.style.transform="";l.classList.remove("turning");
  l.classList.toggle("turned",i<t);
  l.querySelectorAll(".castshadow").forEach(c=>c.classList.remove("on"));
  if(instant)requestAnimationFrame(()=>l.classList.remove("instant"));
 });
 applyDepth();requestAnimationFrame(()=>{drawTrail();pointNext();});
}

function goTo(target){
 target=Math.max(0,Math.min(MAX,target));
 if(busy||target===t)return;
 busy=true;
 const dir=target>t?1:-1;
 const seq=[];for(let k=t;k!==target;k+=dir)seq.push(dir>0?k:k-1);
 seq.forEach((idx,n)=>{
  setTimeout(()=>{
   const leaf=leaves()[idx];if(!leaf)return;
   leaf.style.zIndex=300;leaf.classList.add("turning");
   leaf.style.transform="";
   leaf.classList.toggle("turned",dir>0);
   const nxt=leaves()[idx+(dir>0?1:0)];
   const cs=nxt&&nxt.querySelector(".castshadow");if(cs)cs.classList.add("on");
   rustle();
   setTimeout(()=>{leaf.classList.remove("turning");if(cs)cs.classList.remove("on");},1020);
  },n*80);
 });
 t=target;
 setTimeout(()=>{busy=false;applyDepth();drawTrail();pointNext();},seq.length*80+1060);
 applyDepth();
}

book.addEventListener("click",e=>{
 const jumpEl=e.target.closest("[data-go]");
 if(jumpEl){goTo(+jumpEl.dataset.go);return;}
 const dirEl=e.target.closest("[data-dir]");
 if(dirEl){goTo(t+ +dirEl.dataset.dir);return;}
 const tgt=e.target.closest(".target");
 if(tgt){
  const node=tgt.closest(".node");
  node.classList.add("visited");
  if(node.querySelector(".detail"))node.classList.toggle("open");
  tgt.classList.remove("pulse");
  setTimeout(()=>{drawTrail();},560);
 }
});

document.getElementById("pips").addEventListener("click",e=>{
 const p=e.target.closest(".pip");if(p)goTo(+p.dataset.jump);
});
document.getElementById("ribbon").addEventListener("keydown",e=>{
 if(e.key==="ArrowDown"||e.key==="ArrowRight"){goTo(t+1);e.preventDefault();}
 if(e.key==="ArrowUp"||e.key==="ArrowLeft"){goTo(t-1);e.preventDefault();}
});

let ribDrag=null;
document.getElementById("silk").addEventListener("pointerdown",e=>{
 ribDrag={y:e.clientY,h:book.getBoundingClientRect().height};
 e.target.setPointerCapture(e.pointerId);e.preventDefault();
});
window.addEventListener("pointermove",e=>{
 if(!ribDrag)return;
 const frac=Math.max(0,Math.min(1,(e.clientY-book.getBoundingClientRect().top)/ribDrag.h));
 document.getElementById("ribbonLabel").textContent=LABELS[Math.round(frac*MAX)];
 document.getElementById("silk").style.height=(70+Math.round(frac*MAX)*36)+"px";
});
window.addEventListener("pointerup",e=>{
 if(!ribDrag)return;
 const frac=Math.max(0,Math.min(1,(e.clientY-book.getBoundingClientRect().top)/ribDrag.h));
 ribDrag=null;goTo(Math.round(frac*MAX));
});

let drag=null;
book.addEventListener("pointerdown",e=>{
 if(busy||e.target.closest("button,a,.trailwrap"))return;
 const rect=book.getBoundingClientRect(),half=rect.width/2;
 const narrow=rect.width<700;
 const forward=narrow?true:(e.clientX>rect.left+half);
 const idx=forward?t:t-1;
 const leaf=leaves()[idx];if(!leaf)return;
 if(forward&&t>=MAX)return;if(!forward&&t<=0)return;
 drag={leaf,forward,x:e.clientX,half:narrow?rect.width:half};
 leaf.classList.add("instant","turning");leaf.style.zIndex=300;
});
window.addEventListener("pointermove",e=>{
 if(!drag)return;
 const dx=e.clientX-drag.x;
 let r=drag.forward?Math.max(0,Math.min(1,-dx/drag.half)):Math.max(0,Math.min(1,dx/drag.half));
 const deg=drag.forward?-r*179:-179+r*179;
 drag.leaf.style.transform="rotateY("+deg+"deg)";
});
function endDrag(e){
 if(!drag)return;
 const dx=e.clientX-drag.x,d=drag;
 drag=null;
 d.leaf.classList.remove("instant");
 const passed=d.forward?(-dx>d.half*.28):(dx>d.half*.28);
 d.leaf.style.transform="";
 if(passed){d.leaf.classList.remove("turning");rustle();goTo(d.forward?t+1:t-1);}
 else{setTimeout(()=>{d.leaf.classList.remove("turning");applyDepth();},560);}
}
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")goTo(t+1);
 if(e.key==="ArrowLeft")goTo(t-1);
});

document.getElementById("sound").addEventListener("click",e=>{
 soundOn=!soundOn;
 e.currentTarget.setAttribute("aria-pressed",String(soundOn));
 e.currentTarget.textContent=soundOn?"sound on":"sound off";
 if(soundOn)rustle();
});

window.addEventListener("resize",()=>drawTrail());
setState(typeof window.START_T==="number"?window.START_T:0,true);
</script>
</body>
</html>
